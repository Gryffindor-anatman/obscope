[project]
name = "obs-mcp"
version = "0.1.0"
description = "MCP server exposing VictoriaLogs/Metrics/Traces query APIs to Claude Code"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["obs_mcp"]
