[project]
name = "db-mcp"
version = "0.1.0"
description = "MCP server exposing MySQL and Redis for Claude Code debugging"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "aiomysql>=0.2.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["db_mcp"]
